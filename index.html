<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neuralis Zero Hour v2.0.0</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, #0d1b2e 0%, #050911 72%);
      color: #e6f2ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stage {
      position: relative;
      height: 100dvh;
      max-width: 100vw;
      aspect-ratio: 9 / 16;
      background: #060b14;
      box-shadow: 0 0 48px rgba(0, 210, 255, 0.16), 0 0 0 1px rgba(0, 210, 255, 0.22);
      overflow: hidden;
    }
    @media (max-aspect-ratio: 9/16) {
      #stage {
        width: 100vw;
        height: auto;
        max-height: 100dvh;
      }
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #060b14;
      touch-action: none;
    }
    #loader-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: linear-gradient(180deg, #07101f 0%, #040811 100%);
      z-index: 10;
      transition: opacity 0.25s ease;
    }
    #loader-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #3be0ff;
      margin-bottom: 6px;
      text-align: center;
    }
    #loader-sub {
      font-size: 13px;
      color: #93b0cf;
      margin-bottom: 20px;
      text-align: center;
    }
    #bar-track {
      width: 82%;
      height: 12px;
      border-radius: 999px;
      background: #102036;
      border: 1px solid #1d4166;
      overflow: hidden;
    }
    #bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00a8ff, #42f5ff);
      transition: width 0.12s linear;
    }
    #loader-pct {
      margin-top: 10px;
      font-size: 13px;
      color: #bfe6ff;
    }
    #loader-err {
      margin-top: 14px;
      font-size: 13px;
      color: #ff7373;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader-overlay">
      <div id="loader-title">Neuralis Zero Hour</div>
      <div id="loader-sub">v2.0.0 • Web Preview</div>
      <div id="bar-track"><div id="bar-fill"></div></div>
      <div id="loader-pct">0%</div>
      <div id="loader-err"></div>
    </div>
  </div>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const overlay = document.querySelector("#loader-overlay");
    const barFill = document.querySelector("#bar-fill");
    const pctText = document.querySelector("#loader-pct");
    const errText = document.querySelector("#loader-err");

    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/bcb7870acdf20f58718500fae3f0ff6b.loader.js?v=2.0.0";
    const config = {
      dataUrl: buildUrl + "/5809d4e12568453a2920db4381cb6029.data.unityweb",
      frameworkUrl: buildUrl + "/a14c5eba52a3c49b1412f6b439fe7b14.framework.js.unityweb",
      codeUrl: buildUrl + "/61e1c4a6292114f130cfca993004a692.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "jemangr",
      productName: "Neuralis Zero Hour",
      productVersion: "2.0.0",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      matchWebGLToCanvasSize: true
    };

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        const pct = Math.round(progress * 100);
        barFill.style.width = pct + "%";
        pctText.textContent = pct + "%";
      }).then(() => {
        overlay.style.opacity = "0";
        setTimeout(() => { overlay.style.display = "none"; }, 260);
      }).catch((message) => {
        errText.style.display = "block";
        errText.textContent = String(message);
      });
    };
    script.onerror = () => {
      errText.style.display = "block";
      errText.textContent = "Failed to load Unity WebGL loader.";
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
