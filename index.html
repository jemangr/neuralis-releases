<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neuralis Zero Hour v2.0.6</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #0d2238 0%, #050b14 60%, #02050a 100%);
      color: #e6f2ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #desktop-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
    }
    #stage {
      position: relative;
      height: 100dvh;
      max-width: 100vw;
      aspect-ratio: 9 / 16;
      background: #060b14;
      box-shadow: 0 0 60px rgba(0, 210, 255, 0.22), 0 0 0 1px rgba(0, 210, 255, 0.35);
      border-radius: 8px;
      overflow: hidden;
    }
    @media (max-aspect-ratio: 9/16) {
      #stage {
        width: 100vw;
        height: auto;
        max-height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #060b14;
      touch-action: none;
    }
    #loader-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: linear-gradient(180deg, #07101f 0%, #040811 100%);
      z-index: 10;
      transition: opacity 0.25s ease;
    }
    #loader-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #3be0ff;
      margin-bottom: 6px;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 0 16px rgba(59, 224, 255, 0.6);
    }
    #loader-sub {
      font-size: 13px;
      color: #93b0cf;
      margin-bottom: 24px;
      text-align: center;
      letter-spacing: 0.5px;
    }
    #bar-track {
      width: 82%;
      max-width: 320px;
      height: 12px;
      border-radius: 999px;
      background: #102036;
      border: 1px solid #1d4166;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }
    #bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #0099ff, #00e5ff);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.8);
      transition: width 0.15s ease-out;
    }
    #loader-pct {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 600;
      color: #bfe6ff;
      letter-spacing: 1px;
    }
    #loader-status {
      margin-top: 6px;
      font-size: 11px;
      color: #6488a8;
      letter-spacing: 0.5px;
    }
    #loader-err {
      margin-top: 16px;
      font-size: 13px;
      color: #ff6b6b;
      text-align: center;
      display: none;
      max-width: 85%;
      line-height: 1.4;
    }
    #retry-btn {
      display: none;
      margin-top: 14px;
      padding: 8px 20px;
      background: #1b3a5c;
      border: 1px solid #3be0ff;
      color: #e6f2ff;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background 0.2s;
    }
    #retry-btn:hover {
      background: #255180;
    }
  </style>
</head>
<body>
  <div id="desktop-wrapper">
    <div id="stage">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loader-overlay">
        <div id="loader-title">Neuralis Zero Hour</div>
        <div id="loader-sub">v2.0.6 • Operational Web Preview</div>
        <div id="bar-track"><div id="bar-fill"></div></div>
        <div id="loader-pct">0%</div>
        <div id="loader-status">Αρχικοποίηση συστημάτων / Initializing...</div>
        <div id="loader-err"></div>
        <button id="retry-btn" onclick="location.reload()">Δοκίμασε ξανά • Retry</button>
      </div>
    </div>
  </div>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const overlay = document.querySelector("#loader-overlay");
    const barFill = document.querySelector("#bar-fill");
    const pctText = document.querySelector("#loader-pct");
    const statusText = document.querySelector("#loader-status");
    const errText = document.querySelector("#loader-err");
    const retryBtn = document.querySelector("#retry-btn");

    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/dcca259085bda2c6a873db8f61d49fb3.loader.js?v=2.0.6";
    const config = {
      dataUrl: buildUrl + "/77dd455c0aacbbc8420b6b6a00b6d2f4.data",
      frameworkUrl: buildUrl + "/5d38e394b693a6ea71d5531a98df4f0e.framework.js",
      codeUrl: buildUrl + "/f5eaf1f1e7d2c74a0b85924ae1478d3f.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "jemangr",
      productName: "Neuralis Zero Hour",
      productVersion: "2.0.6",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      matchWebGLToCanvasSize: true
    };

    let lastPct = 0;
    let lastProgressTime = Date.now();
    let currentStepName = "Έναρξη λήψης (Step 1/4)";

    const watchdogTimer = setInterval(() => {
      if (overlay.style.display === "none") {
        clearInterval(watchdogTimer);
        return;
      }
      if (Date.now() - lastProgressTime > 25000 && lastPct < 99) {
        clearInterval(watchdogTimer);
        errText.style.display = "block";
        retryBtn.style.display = "inline-block";
        errText.innerHTML = `Η σύνδεση καθυστέρησε στο <b>${lastPct}%</b> [${currentStepName}].<br>Πατήστε το κουμπί για άμεση επανάληψη.`;
        console.warn(`[Neuralis Watchdog] Timeout at ${lastPct}% during step: ${currentStepName}`);
      }
    }, 2000);

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      currentStepName = "Μεταγλώττιση WASM (Step 2/4)";
      statusText.textContent = "Λήψη πακέτων & WASM Engine...";
      lastProgressTime = Date.now();

      createUnityInstance(canvas, config, (progress) => {
        const pct = Math.round(progress * 100);
        barFill.style.width = pct + "%";
        pctText.textContent = pct + "%";
        if (pct > lastPct) {
          lastPct = pct;
          lastProgressTime = Date.now();
        }
        if (pct < 30) {
          currentStepName = "Λήψη δεδομένων (Step 1/4)";
          statusText.textContent = "Λήψη πακέτου δεδομένων (Data package)...";
        } else if (pct < 75) {
          currentStepName = "Μεταγλώττιση κώδικα (Step 2/4)";
          statusText.textContent = "Μεταγλώττιση μηχανής WebAssembly...";
        } else if (pct < 98) {
          currentStepName = "Φόρτωση σκηνής (Step 3/4)";
          statusText.textContent = "Αρχικοποίηση 3D καταφυγίου Sector 001...";
        } else {
          currentStepName = "Τερματικό διοίκησης (Step 4/4)";
          statusText.textContent = "Προετοιμασία τερματικού διοίκησης...";
        }
      }).then(() => {
        clearInterval(watchdogTimer);
        overlay.style.opacity = "0";
        setTimeout(() => { overlay.style.display = "none"; }, 280);
      }).catch((message) => {
        clearInterval(watchdogTimer);
        errText.style.display = "block";
        retryBtn.style.display = "inline-block";
        errText.innerHTML = `Σφάλμα φόρτωσης στο <b>${lastPct}%</b> [${currentStepName}]:<br><span style="font-size:11px;color:#ff9e9e;">${String(message)}</span>`;
        console.error("[Neuralis WebGL Error at " + lastPct + "% in " + currentStepName + "]", message);
      });
    };
    script.onerror = () => {
      clearInterval(watchdogTimer);
      errText.style.display = "block";
      retryBtn.style.display = "inline-block";
      errText.textContent = "Αποτυχία λήψης του WebGL loader script. Ελέγξτε τη σύνδεσή σας.";
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
